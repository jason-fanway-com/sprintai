[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vite base="/admin/" makes index.html reference /admin/assets/...
# but the built files live at /assets/ in the publish dir.
# These rewrites map /admin/* paths to the real files BEFORE the SPA fallback.
[[redirects]]
  from = "/admin/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/admin/icons/*"
  to = "/icons/:splat"
  status = 200

[[redirects]]
  from = "/admin/manifest.json"
  to = "/manifest.json"
  status = 200

# SPA fallback — must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
