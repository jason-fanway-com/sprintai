[build]
  # Assemble ONLY the public marketing/app surface into ./public, then publish
  # that dir. The origin therefore serves an explicit allowlist — internal
  # source (admin-dashboard/, supabase/, *.md, *.htmltext, _proof/, scripts,
  # specs, etc.) is never on the origin. See scripts/build-public-site.sh.
  command   = "npm install && bash scripts/build-public-site.sh"
  publish   = "public"
  functions = "netlify/functions"

  # Skip the build entirely when a commit touches only paths that never reach
  # the origin (build notes, docs/, _proof/, supabase/ functions,
  # admin-dashboard/ — the last two deploy elsewhere). exit 0 = skip.
  # Measured against Aug 19–31: 33 of 67 commits would have skipped.
  # The script fails OPEN — any doubt and it builds.
  ignore = "bash scripts/netlify-ignore-build.sh"

[functions]
  node_bundler = "esbuild"

# Cache the shop-chat PWA's dependencies between builds. Netlify only
# auto-caches node_modules at the base directory, so the nested
# `cd shop-chat && npm install` in build-public-site.sh currently pays for a
# cold React + Vite + Tailwind install on EVERY build.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["shop-chat/node_modules"]

# Redirect /webhook → Netlify function (cleaner URL for Stripe dashboard)
[[redirects]]
  from = "/webhook"
  to   = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/create-checkout-session"
  to   = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/sms-webhook"
  to   = "/.netlify/functions/sms-webhook"
  status = 200

# Admin dashboard (incl. Command Center) is a SEPARATE, login-gated Netlify
# site (sprintai-chat-admin). It is intentionally NOT copied into ./public.
# These proxy rewrites let staff reach the gated admin via getsprintai.com/admin
# WITHOUT putting any admin source on the root origin: Netlify proxies the
# request to the external admin site at request time. Auth still happens on the
# admin app (Supabase login) — the proxy exposes nothing that login doesn't.
# The admin SPA is built with base="/admin/" and BrowserRouter basename="/admin".
# Proxy pay.getsprintai.com/o/* → Supabase pay-redirect function (302s to Stripe)
# Uses 302 (not 200 proxy) because the target itself 302s to Stripe —
# a proxy would hide the Stripe redirect from the handset.
[[redirects]]
  from = "/o/*"
  to = "https://rvdqfxtrskxekfkqnegx.supabase.co/functions/v1/pay-redirect/o/:splat"
  status = 302
  force = true

# The public tester page was renamed try.html -> test-kitchen.html on
# 2026-09-05 (it is the OrderFare Test Kitchen; the filename should match the
# thing). Jason had already texted /try to people, and a dead link to a friend
# is worse than a stale one — so /try is a PERMANENT redirect, not a removal.
[[redirects]]
  from = "/try"
  to = "/test-kitchen"
  status = 301
  force = true

[[redirects]]
  from = "/try.html"
  to = "/test-kitchen"
  status = 301
  force = true

[[redirects]]
  from = "/demo/jasons-pizza"
  to = "/demo/marios-pizza"
  status = 301
  force = true

[[redirects]]
  from = "/demo/jasons-pizza/*"
  to = "/demo/marios-pizza/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "https://sprintai-chat-admin.netlify.app/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://sprintai-chat-admin.netlify.app/admin/:splat"
  status = 200
  force = true

# ── Shop owner chat PWA ────────────────────────────────────────────────────
# shop-chat is a Vite PWA built to shop-chat/dist/ and copied to public/chat/
# by build-public-site.sh. Served as static files on the root origin.
# Netlify auto-redirects /chat → /chat/ for directories with index.html.
# Do NOT add an explicit /chat → /chat/ 301 with force=true — it matches
# /chat/ too and creates a self-redirect loop at the edge.

# SPA catch-all: /chat/* serves from public/chat/ (publish dir).
# Vite base="/chat/" ensures all asset references are /chat/assets/...
# which resolves correctly from the publish directory.
# Netlify serves real files first; unmatched paths fall back to index.html.
[[redirects]]
  from = "/chat/*"
  to = "/chat/index.html"
  status = 200
